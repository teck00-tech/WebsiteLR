<header class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a routerLink="/">Lea Rienecker</a>
    </div>

    <nav class="navbar-nav">
      <ul class="nav-menu">
        <li class="nav-item">
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            Home
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/gallery"
            routerLinkActive="active"
            class="nav-link"
          >
            Gallery
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/design"
            routerLinkActive="active"
            class="nav-link"
          >
            About Me
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/contact"
            routerLinkActive="active"
            class="nav-link"
          >
            Contact
          </a>
        </li>

        @if (authService.isAdmin()) {
          <li class="nav-item">
            <a
              routerLink="/admin"
              routerLinkActive="active"
              class="nav-link"
            >
              Admin
            </a>
          </li>
        }

        <li class="nav-item">
          @if (authService.isLoggedIn()) {
            <button
              type="button"
              class="nav-link nav-button"
              (click)="logout()"
            >
              Log out
            </button>
          } @else {
            <a routerLink="/login" class="nav-link">Login</a>
          }
        </li>
      </ul>
    </nav>
  </div>
</header>
