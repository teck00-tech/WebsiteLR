<main class="project-detail" *ngIf="project; else missingProject">
  <a class="back-link" routerLink="/gallery">← Zurück zur Galerie</a>
  <section class="project-heading">
    <div>
      <p class="eyebrow">{{ project.category }}</p>
      <h1>{{ project.title }}</h1>
      <p class="project-description">{{ project.description }}</p>
    </div>
    <a class="contact-link" routerLink="/contact">Ähnliches Projekt starten</a>
  </section>

  <section class="project-images">
    <figure *ngFor="let image of project.images">
      <img [src]="image" [alt]="project.title" />
    </figure>
  </section>
</main>

<ng-template #missingProject>
  <main class="missing-project">
    <h1>Projekt nicht gefunden</h1>
    <p>Dieses Projekt existiert nicht oder wurde entfernt.</p>
    <a routerLink="/gallery">Zur Galerie</a>
  </main>
</ng-template>
